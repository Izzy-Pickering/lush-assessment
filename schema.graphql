"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Mutation {
  addTask(data: TaskDetails!): Task
  addTaskList(data: taskListDetails!): TaskList
  deleteTask(id: Int!): Task
  updateNumberOfTasks(id: Int!): TaskList
  updateTask(completed: Boolean, id: Int, title: String): Task
}

type Query {
  allTaskList: [TaskList!]
  taskById(id: Int!): Task
  taskByTaskListId(orderByCompletionStatus: Boolean, taskListId: Int!): [Task!]
}

"""
Individual task to be completed. Will always belong to a specific task list.
"""
type Task {
  completed: Boolean
  createdAt: DateTime
  id: ID
  taskListId: Int
  title: String
  updatedAt: DateTime
}

input TaskDetails {
  taskListId: Int!
  title: String!
}

"""List containing multiple tasks to be completed."""
type TaskList {
  createdAt: DateTime
  id: ID
  name: String
  numberOfTasks: Int
}

input taskListDetails {
  name: String!
}